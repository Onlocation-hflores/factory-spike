# SPIKE-02 Q4b: does a push made with a GitHub App installation token start CI (ci.yml on factory/**)?
# Also checks D-05: the App has no Workflows permission, so a push touching .github/workflows must be refused.
name: app-token
on: workflow_dispatch
permissions: {}
jobs:
  push:
    runs-on: ubuntu-24.04
    steps:
      - id: t
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.SPIKE_APP_ID }}
          private-key: ${{ secrets.SPIKE_APP_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.t.outputs.token }}
          persist-credentials: true
      - name: Push marker with App token
        run: |
          git config user.name spike-app && git config user.email spike@invalid
          git checkout -b "factory/app-${GITHUB_RUN_ID}"
          date > app-marker.txt && git add app-marker.txt && git commit -qm "Q4b marker"
          git push origin HEAD
      - name: Push touching .github/workflows must be refused
        run: |
          git checkout -b "factory/appwf-${GITHUB_RUN_ID}"
          echo "# x" >> .github/workflows/ci.yml && git commit -qam "workflow edit"
          if git push origin HEAD 2> err.txt; then echo "D-05: PUSH ACCEPTED (unexpected)"; exit 1; fi
          cat err.txt; echo "D-05: workflow push refused"
